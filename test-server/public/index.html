<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Acme Enterprise LLM</title>
<style>
  :root { --bg:#0f1216; --panel:#171b21; --line:#262c35; --text:#e6e9ee; --muted:#8b95a3; --accent:#4c8dff; --warn:#f0a12e; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
         font:14px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:12px 18px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.2px; }
  .badge { font-size:11px; color:var(--warn); border:1px solid var(--warn); border-radius:20px; padding:2px 9px; }
  .spacer { flex:1; }
  input, select, button { font:inherit; background:var(--panel); color:var(--text);
                          border:1px solid var(--line); border-radius:7px; padding:7px 10px; }
  input:focus, select:focus { outline:1px solid var(--accent); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  #log { flex:1; overflow-y:auto; padding:22px 18px; display:flex; flex-direction:column; gap:16px; }
  .msg { max-width:860px; width:100%; margin:0 auto; }
  .who { font-size:11px; text-transform:uppercase; letter-spacing:.9px; color:var(--muted); margin-bottom:5px; }
  .bubble { white-space:pre-wrap; word-wrap:break-word; background:var(--panel);
            border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .msg.human .bubble { background:#1b2430; border-color:#2b3a4d; }
  .meta { font-size:11px; color:var(--muted); margin-top:6px; }
  .meta.capped { color:var(--warn); }
  footer { border-top:1px solid var(--line); padding:12px 18px; }
  .row { max-width:860px; margin:0 auto; display:flex; gap:10px; }
  .row input { flex:1; }
  .hint { max-width:860px; margin:8px auto 0; font-size:11.5px; color:var(--muted); }
  code { background:#000; padding:1px 5px; border-radius:4px; color:#c9d3e0; }
</style>
</head>
<body>
<header>
  <h1>Acme Enterprise LLM</h1>
  <span class="badge" id="cap">5000 char cap</span>
  <div class="spacer"></div>
  <select id="model"><option value="corp-fast">corp-fast</option><option value="corp-reasoning">corp-reasoning</option></select>
  <input id="token" type="password" placeholder="X-Corp-Auth token" size="26" />
  <button id="connect">Connect</button>
</header>

<div id="log">
  <div class="msg"><div class="who">system</div><div class="bubble">Paste your auth token and press Connect. This service is chat-only and is not OpenAI-compatible — responses stop hard at 5000 characters.</div></div>
</div>

<footer>
  <div class="row">
    <input id="input" placeholder="Ask something…  (try: write 200 numbered lines)" disabled />
    <button id="send" class="primary" disabled>Send</button>
  </div>
  <div class="hint">POST <code>/corp/v2/converse</code> · header <code>X-Corp-Auth</code> · body <code>{modelAlias, turns:[{speaker,utterance}]}</code></div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const turns = [];
let token = '';

function bubble(who, text = '') {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + who;
  wrap.innerHTML = '<div class="who"></div><div class="bubble"></div><div class="meta"></div>';
  wrap.querySelector('.who').textContent = who;
  wrap.querySelector('.bubble').textContent = text;
  $('log').appendChild(wrap);
  $('log').scrollTop = $('log').scrollHeight;
  return wrap;
}

$('connect').onclick = async () => {
  token = $('token').value.trim();
  const res = await fetch('/corp/v2/models', { headers: { 'X-Corp-Auth': token } });
  if (!res.ok) { bubble('system', 'Rejected: invalid or expired token.'); return; }
  const info = await res.json();
  $('cap').textContent = info.limits.maxResponseChars + ' char cap';
  bubble('system', 'Connected. Models: ' + info.models.map((m) => m.alias).join(', '));
  $('input').disabled = $('send').disabled = false;
  $('input').focus();
};

async function send() {
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  bubble('human', text);
  turns.push({ speaker: 'human', utterance: text });

  const holder = bubble('assistant');
  const bub = holder.querySelector('.bubble');
  const meta = holder.querySelector('.meta');
  $('send').disabled = true;

  const res = await fetch('/corp/v2/converse', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'X-Corp-Auth': token },
    body: JSON.stringify({ modelAlias: $('model').value, turns, streaming: true }),
  });

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', answer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf('\n')) !== -1) {
      const line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (data === 'EOM') continue;
      const frame = JSON.parse(data);
      if (frame.event === 'chunk') {
        answer += frame.payload.deltaText;
        bub.textContent = answer;
        $('log').scrollTop = $('log').scrollHeight;
      } else if (frame.event === 'complete') {
        meta.textContent = frame.charCount + ' chars · stopReason=' + frame.stopReason;
        if (frame.stopReason === 'charLimit') {
          meta.className = 'meta capped';
          meta.textContent += '  ← truncated at the cap';
        }
      }
    }
  }
  turns.push({ speaker: 'assistant', utterance: answer });
  $('send').disabled = false;
  $('input').focus();
}

$('send').onclick = send;
$('input').onkeydown = (e) => { if (e.key === 'Enter') send(); };
</script>
</body>
</html>
